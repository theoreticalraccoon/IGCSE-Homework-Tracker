<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markwise — IGCSE study assistant</title>
  <meta name="description"
    content="Markwise plans your IGCSE work and answers, marks and quizzes you from the real past papers, mark schemes and syllabus.">
  <meta name="color-scheme" content="light dark">

  <script>
    /* Apply the stored theme before first paint so there is no flash. */
    try {
      document.documentElement.setAttribute("data-theme", localStorage.getItem("markwise-theme") || "system");
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "system");
    }
  </script>

  <link rel="stylesheet" href="src/css/app.css">
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f4fc4'/><path d='M8 17l5 5 11-12' stroke='white' stroke-width='3.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>

<body>

  <!-- ==================== Sign in / sign up ==================== -->
  <div class="auth-screen" id="authScreen" hidden></div>

  <!-- ==================== Set a new password ==================== -->
  <div class="auth-screen" id="recoveryScreen" hidden></div>

  <!-- ==================== First-run subject picker ==================== -->
  <div class="auth-screen" id="onboardScreen" hidden></div>

  <!-- ==================== The app ==================== -->
  <div class="app-shell" id="appShell" hidden>

    <nav class="sidebar" aria-label="Main">
      <div class="brand-mark">
        <span class="brand-glyph" aria-hidden="true">✓</span>
        <span class="brand-name">Markwise</span>
      </div>

      <button class="nav-link" data-nav="today">
        <span class="nav-glyph" aria-hidden="true">◧</span> Today <span class="nav-key">T</span>
      </button>
      <button class="nav-link" data-nav="planner">
        <span class="nav-glyph" aria-hidden="true">☑</span> Planner <span class="nav-key">P</span>
      </button>
      <button class="nav-link" data-nav="calendar">
        <span class="nav-glyph" aria-hidden="true">▦</span> Calendar <span class="nav-key">C</span>
      </button>

      <p class="nav-section">Study with the papers</p>
      <button class="nav-link" data-nav="ask">
        <span class="nav-glyph" aria-hidden="true">✦</span> Ask <span class="nav-key">A</span>
      </button>
      <button class="nav-link" data-nav="mark">
        <span class="nav-glyph" aria-hidden="true">✓</span> Mark my answer <span class="nav-key">M</span>
      </button>
      <button class="nav-link" data-nav="mock">
        <span class="nav-glyph" aria-hidden="true">▤</span> Mock exams <span class="nav-key">K</span>
      </button>
      <button class="nav-link" data-nav="library">
        <span class="nav-glyph" aria-hidden="true">▥</span> Library <span class="nav-key">L</span>
      </button>
      <button class="nav-link" data-nav="progress">
        <span class="nav-glyph" aria-hidden="true">▲</span> Progress <span class="nav-key">G</span>
      </button>

      <div class="sidebar-foot">
        <span class="user-email" id="userEmail"></span>
        <button class="nav-link" data-nav="settings">
          <span class="nav-glyph" aria-hidden="true">⚙</span> Settings
        </button>
        <button class="nav-link" id="signOut">
          <span class="nav-glyph" aria-hidden="true">→</span> Sign out
        </button>
      </div>
    </nav>

    <div>
      <div class="topbar">
        <button class="icon-btn" id="navToggle" aria-label="Menu">☰</button>
        <span class="brand-name">Markwise</span>
      </div>
      <main class="main" id="outlet"></main>
    </div>
  </div>

  <div class="overlay" id="modalOverlay" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="src/js/app.js"></script>

  <noscript>
    <div class="auth-screen">
      <div class="auth-card">
        <h1>JavaScript required</h1>
        <p class="auth-sub">Markwise needs JavaScript to load your work and talk to the papers.</p>
      </div>
    </div>
  </noscript>
</body>

</html>
