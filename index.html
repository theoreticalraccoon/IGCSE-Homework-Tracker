<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markwise: IGCSE study assistant</title>
  <meta name="description"
    content="Track your homework, and get answers and marking from the real IGCSE past papers and mark schemes.">
  <meta name="color-scheme" content="light dark">

  <script>
    /* Apply the stored theme before first paint so there is no flash. */
    try {
      document.documentElement.setAttribute("data-theme", localStorage.getItem("markwise-theme") || "system");
    } catch (e) {
      document.documentElement.setAttribute("data-theme", "system");
    }
  </script>

  <link rel="stylesheet" href="src/css/app.css">
  <link rel="stylesheet" href="src/css/chat.css">
  <link rel="icon" type="image/svg+xml" href="src/assets/markwise-icon.svg">
  <link rel="apple-touch-icon" href="src/assets/markwise-icon.svg">
  <meta name="theme-color" content="#2F6BFF">

</head>

<body>

  <div class="auth-screen" id="authScreen" hidden></div>
  <div class="auth-screen" id="recoveryScreen" hidden></div>
  <div class="auth-screen" id="onboardScreen" hidden></div>

  <div class="app-shell" id="appShell" hidden>

    <nav class="sidebar" aria-label="Main">
      <div class="brand-mark">
        <img class="brand-glyph" src="src/assets/markwise-icon.svg" alt="" width="26" height="26">
        <span class="brand-name">Mark<span>wise</span></span>
      </div>

      <button class="nav-link" data-nav="planner">
        <span class="nav-glyph" aria-hidden="true">☑</span> Planner
      </button>
      <button class="nav-link" data-nav="assistant">
        <span class="nav-glyph" aria-hidden="true">✦</span> Assistant
      </button>
      <button class="nav-link" data-nav="mock">
        <span class="nav-glyph" aria-hidden="true">▤</span> Mock exams
      </button>
      <button class="nav-link" data-nav="markpaper">
        <span class="nav-glyph" aria-hidden="true">✓</span> Mark a paper
      </button>

      <div class="sidebar-foot">
        <button class="nav-link subtle" data-nav="progress">
          <span class="nav-glyph" aria-hidden="true">▲</span> Progress
        </button>
        <button class="nav-link subtle" data-nav="settings">
          <span class="nav-glyph" aria-hidden="true">⚙</span> Settings
        </button>
        <span class="user-email" id="userEmail"></span>
        <button class="nav-link subtle" id="signOut">
          <span class="nav-glyph" aria-hidden="true">→</span> Sign out
        </button>
      </div>
    </nav>

    <div class="app-main">
      <div class="topbar">
        <button class="icon-btn" id="navToggle" aria-label="Menu">☰</button>
        <span class="brand-name">Markwise</span>
      </div>
      <main class="main" id="outlet"></main>
    </div>
  </div>

  <div class="overlay" id="modalOverlay" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script type="module" src="src/js/app.js"></script>

  <noscript>
    <div class="auth-screen">
      <div class="auth-card">
        <h1>JavaScript required</h1>
        <p class="auth-sub">Markwise needs JavaScript to load your work.</p>
      </div>
    </div>
  </noscript>
</body>

</html>
